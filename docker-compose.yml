version: '3.9'
services:
  backend:
    build: ./backend
    command: npm run dev
    ports:
      - "4000:4000"
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      - mongo
      - redis
  frontend:
    build: ./frontend
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    env_file:
      - frontend/.env
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  mongo-data:
