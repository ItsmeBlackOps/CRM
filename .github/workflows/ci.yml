name: ci
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.txt'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.svg'
      - '**/*.gif'
      - '**/*.ico'
      - 'docs/**'
  push:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect docs-only change
        id: docs
        run: |
          if git diff --name-only ${{ github.base_ref }}...${{ github.sha }} | grep -vE '\.(md|mdx|txt|png|jpg|svg|gif|ico)$' | grep -vE '^docs/'; then
            echo "docs_only=false" >> $GITHUB_OUTPUT
          else
            echo "docs_only=true" >> $GITHUB_OUTPUT
          fi
      - name: Setup Node
        if: steps.docs.outputs.docs_only == 'false'
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install
        if: steps.docs.outputs.docs_only == 'false'
        run: npm ci --workspaces
      - name: Lint
        if: steps.docs.outputs.docs_only == 'false'
        run: npm run lint --workspaces --if-present
      - name: Test
        if: steps.docs.outputs.docs_only == 'false'
        run: npm test --workspaces --if-present
